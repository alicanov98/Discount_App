name: iOS CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Select compatible iPhone simulator
        id: simulator
        shell: bash
        run: |
          xcodebuild -showdestinations \
            -project Discount.xcodeproj \
            -scheme Discount > destinations.txt

          cat destinations.txt

          SIMULATOR_ID=$(python3 - <<'PY'
          import re
          from pathlib import Path

          destinations = Path("destinations.txt").read_text()
          for line in destinations.splitlines():
              if "platform:iOS Simulator," in line and "name:iPhone" in line:
                  match = re.search(r"id:([0-9A-Fa-f-]{36})", line)
                  if match:
                      print(match.group(1))
                      break
          else:
              raise SystemExit("Layihəyə uyğun iPhone simulatoru tapılmadı.")
          PY
          )

          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          xcodebuild test \
            -project Discount.xcodeproj \
            -scheme Discount \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
